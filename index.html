<script>
(function(){
  var el=document.getElementById('loading'),fill=el.querySelector('.ld-fill'),num=el.querySelector('.ld-num'),water=el.querySelector('.ld-water'),prog=el.querySelector('.ld-progress');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var waves=[].map.call(el.querySelectorAll('[data-ld-wave]'),function(p){return{p:p,v:p.getAttribute('data-ld-wave').split(',').map(Number)}});
  var blobs=[].map.call(el.querySelectorAll('[data-ld-blob]'),function(b){return{b:b,ph:+b.getAttribute('data-ld-blob')}});
  var root=document.documentElement;root.style.overflow='hidden';
  var DUR=reduce?300:3500,t0=performance.now(),loaded=document.readyState==='complete',done=false;
  window.addEventListener('load',function(){loaded=true});
  // FV写真の切り替え：ローディングが消えてから6秒ごとに次の写真へ（表示は CSS の html[data-fv]）
  function fvStart(){
    if(reduce)return;
    var i=0;root.setAttribute('data-fv','0');
    setInterval(function(){i=(i+1)%3;root.setAttribute('data-fv',String(i))},6000);
  }
  function draw(t){
    // 波は画面幅いっぱいに伸縮するため、狭い画面ほど横に詰まって急になる。幅に応じて波長を広げ・振幅を抑えて穏やかに保つ
    var vw=window.innerWidth,sx=Math.min(1.8,Math.max(1,800/vw)),sa=Math.min(1,Math.max(0.75,vw/800));
    for(var i=0;i<waves.length;i++){var w=waves[i].v,d='',L=w[1]*sx,A=w[0]*sa;for(var x=0;x<=400;x+=8){var y=w[4]+A*(0.7*Math.sin(x/L*6.2832+t*w[2]+w[3])+0.3*Math.sin(x/(L*0.53)*6.2832-t*w[2]*0.8+w[3]*1.7));d+=(x?'L':'M')+x+','+y.toFixed(2)}waves[i].p.setAttribute('d',d+'L400,100L0,100Z')}
    for(var j=0;j<blobs.length;j++){var r=[];for(var k=0;k<8;k++)r.push((50+13*Math.sin(t*0.55+blobs[j].ph+k*1.9)).toFixed(2)+'%');blobs[j].b.style.borderRadius=r.slice(0,4).join(' ')+' / '+r.slice(4).join(' ')}
  }
  draw(0);
  function tick(now){
    if(done)return;
    var q=Math.min(1,(now-t0)/DUR),p=q<.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;if(!loaded)p=Math.min(p,0.9);
    fill.style.width=(p*100).toFixed(1)+'%';num.textContent=Math.round(p*100)+'%';
    // 水位を進み具合に合わせて上げる（82lvh ÷ 高さ130lvh）。濃い青の水面より下に沈んだ進捗表示は白に
    water.style.transform='translate3d(0,'+(-63.08*p).toFixed(3)+'%,0)';
    var pr=prog.getBoundingClientRect();prog.classList.toggle('wet',(pr.top+pr.bottom)/2>window.innerHeight*(0.886-0.82*p));
    if(!reduce)draw((now-t0)/1000*0.6);
    if(q>=1&&p>=1){done=true;setTimeout(function(){el.classList.add('is-done');root.style.overflow='';setTimeout(function(){el.remove();fvStart()},1100)},500);return}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
